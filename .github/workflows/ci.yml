name: CI

on:
  push:
  pull_request:
  # The release workflow calls this one at a tag (release.yml).
  workflow_call:

permissions:
  contents: read

jobs:
  entries:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check out the specification at the pinned commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Judgment-Pack/judgment-pack-spec
          ref: f821757fcaf5cb9831dbcb1f8b386a5ead793e4a
          path: .spec
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check the manifest, the entries and their fixtures
        run: python -m unittest discover -s tests -v

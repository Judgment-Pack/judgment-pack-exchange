name: CI

on:
  push:
  pull_request:
  # The release workflow calls this one at a tag (release.yml).
  workflow_call:

permissions:
  contents: read

jobs:
  entries:
    runs-on: ubuntu-latest
    steps:
      # Every commit and tag: an entry's `upgrade` keys are checked against the manifests of the
      # catalog's earlier releases, read from its tags (RFC 0019 §3; docs/entry-format.md).
      - name: Check out the repository with its tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the specification at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Judgment-Pack/judgment-pack-spec
          ref: cae45edb94e57c9505813d2e64820342d6bd2ef5
          path: .spec
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check the manifest, the entries and their fixtures
        run: python -m unittest discover -s tests -v

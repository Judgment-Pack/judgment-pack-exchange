name: CI

# The check list is dev.json, run by scripts/dev/check.sh (the development kit's vendored runner).
# One job, `entries`, which branch protection requires by name. The two checkouts are read by the
# tests (tests/test_entries.py, VerifierPin): the `ref` of the specification checkout is the pin
# CONTRIBUTING.md and the verification record's locator must name too.
#
# A push to main records the evidence the release takes for the checks that read the commit's tree
# alone (scripts/dev/release_evidence.py capture; .github/ci-evidence.json; docs/releasing.md). The
# checks named in HISTORY_CHECKS read the catalog's tags and release history, which the release's
# tag changes, so the release runs them again in the tag's own context: release.yml calls this
# workflow with `tag-context: true` (exchange #38).

on:
  # Branches only: a tag push no longer starts this workflow. The release workflow's call at the tag
  # is the one run in the tag's context, and the release waits for it (release.yml, `CI at the tag`).
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      tag-context:
        description: "Run only HISTORY_CHECKS, the checks that read the tags and the release history (the release, after its evidence gate)."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  entries:
    name: entries
    runs-on: ubuntu-latest
    env:
      # The dev.json checks whose result depends on the tag a run is held for and on the catalog's
      # earlier releases, read from its tags (tests/test_entries.py, release_being_made). Main's
      # evidence leaves them out; the release runs them at the tag.
      HISTORY_CHECKS: entries
    steps:
      # Every commit and tag: an entry's `upgrade` keys are checked against the manifests of the
      # catalog's earlier releases, and every artifact pair against the entries those manifests pin,
      # read from its tags (RFC 0019 §§3, 7; docs/entry-format.md). A shallow clone may omit release
      # history and tags, and the tests refuse it as artifact-history-invalid rather than check by
      # form alone.
      - name: Check out the repository with its tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the specification at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Judgment-Pack/judgment-pack-spec
          ref: 4bec33ae9ff5947ddcb6b812c558a9aab6ce56d1
          path: .spec
          persist-credentials: false

      # First, so that a manifest that does not parse fails before the long steps start.
      - name: Read the toolchains from dev.json
        id: dev
        run: |
          set -eu
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          m = json.load(open("dev.json", encoding="utf-8"))
          tc = m.get("toolchains", {})
          print("python=" + tc.get("python", {}).get("version", "3.12"))
          PY

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.dev.outputs.python }}

      - name: Setup steps
        run: scripts/dev/check.sh --setup

      # The manifest, the entries and their fixtures (the `entries` step of dev.json). A pull request
      # runs the checks jpdev.json maps its changed paths to (the whole list when a path is unmapped,
      # or when the mapping, the manifest or the runner changed); the first checkout's whole history
      # gives --changed the merge base with the base branch. A push runs the whole list, in two
      # parts: the checks that read the tree, whose summary is the evidence log, then
      # HISTORY_CHECKS; a failure in the first part does not stop the second. The release
      # workflow's call at the tag runs HISTORY_CHECKS alone.
      - name: Checks
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          TAG_CONTEXT: ${{ inputs.tag-context }}
          CHECK_LOG: ${{ runner.temp }}/checks.log
        run: |
          set -o pipefail
          if [ "$EVENT" = pull_request ]; then
            scripts/dev/check.sh --all --changed "origin/$BASE_REF"
          elif [ "$TAG_CONTEXT" = true ]; then
            scripts/dev/check.sh --all --only "$HISTORY_CHECKS"
          else
            status=0
            scripts/dev/check.sh --all --skip "$HISTORY_CHECKS" | tee "$CHECK_LOG" || status=1
            scripts/dev/check.sh --all --only "$HISTORY_CHECKS" || status=1
            exit "$status"
          fi

      # Main only, after every check passed: the evidence of the checks that read the tree, which
      # the release takes instead of running them again (docs/releasing.md).
      - name: Record exact CI inputs and coverage
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: python3 scripts/dev/release_evidence.py capture --workflow ci --job entries --check-log "${{ runner.temp }}/checks.log" --output "${{ runner.temp }}/evidence.json"

      - name: Upload immutable CI evidence
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-ci-entries-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          if-no-files-found: error
          retention-days: 7

name: CI

# The check list is dev.json, run by scripts/dev/check.sh (the development kit's vendored runner).
# One job, `entries`, which branch protection requires by name. The two checkouts are read by the
# tests (tests/test_entries.py, VerifierPin): the `ref` of the specification checkout is the pin
# CONTRIBUTING.md and the verification record's locator must name too.

on:
  push:
  pull_request:
  # The release workflow calls this one at a tag (release.yml).
  workflow_call:

permissions:
  contents: read

jobs:
  entries:
    runs-on: ubuntu-latest
    steps:
      # Every commit and tag: an entry's `upgrade` keys are checked against the manifests of the
      # catalog's earlier releases, and every artifact pair against the entries those manifests pin,
      # read from its tags (RFC 0019 §§3, 7; docs/entry-format.md). A shallow clone may omit release
      # history and tags, and the tests refuse it as artifact-history-invalid rather than check by
      # form alone.
      - name: Check out the repository with its tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the specification at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Judgment-Pack/judgment-pack-spec
          ref: 4bec33ae9ff5947ddcb6b812c558a9aab6ce56d1
          path: .spec
          persist-credentials: false

      # First, so that a manifest that does not parse fails before the long steps start.
      - name: The manifest parses and its first step runs
        run: scripts/dev/check.sh --manifest dev.json --only local-paths

      - name: Read the toolchains from dev.json
        id: dev
        run: |
          set -eu
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          m = json.load(open("dev.json", encoding="utf-8"))
          tc = m.get("toolchains", {})
          print("python=" + tc.get("python", {}).get("version", "3.12"))
          PY

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.dev.outputs.python }}

      - name: Setup steps
        run: scripts/dev/check.sh --setup

      # The manifest, the entries and their fixtures (the `entries` step of dev.json).
      - name: Checks
        run: scripts/dev/check.sh --all

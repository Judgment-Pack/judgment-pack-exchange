name: Release

# Publishes a release of the Exchange, a catalog in the entry format: the
# manifest.json of a tagged commit, its checksums and a build-provenance
# attestation, from a tag a person pushes on a commit already on main
# (docs/releasing.md). What a release is to a consumer is the release
# contract (docs/release-contract.md, after RFC 0019 §7): the tagged commit,
# from which a consumer reads the manifest and every entry file as blobs.
# The release's manifest.json is that commit's blob, byte for byte.
#
# A person decides there is a release and writes its notes
# (docs/releases/<tag>.md). The workflow holds the tagged commit to CI: to the
# evidence main's CI recorded at that exact commit for the checks that read
# the commit's tree, or a refusal (docs/releasing.md), then to the checks that
# read the tags and the release history, run again at the tag. It writes the
# release's files from the commit, attests them, and publishes no release
# until a maintainer approves the `release` environment.
#
# Not secret before that approval: the files (an artifact of the run), their
# attestation (recorded in a public log when made), and the draft (visible to
# those who can write to the repository).
#
# Every job works on the commit the run was started for, by digest. A tag is a
# name and can be moved until its release is published, so the tag is compared
# with that commit when the run begins, before the draft, and before publishing.

on:
  push:
    tags:
      # Narrowed here, held exactly to the grammar by the first step.
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

env:
  RELEASE_TAG: ${{ github.ref_name }}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  admit:
    name: Admit the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Reading an environment's protection rules.
      actions: read
    steps:
      # RFC 0019 §3's release-tag grammar: vMAJOR.MINOR.PATCH in ASCII digits,
      # no leading zeroes, nothing before or after (docs/entry-format.md).
      - name: Validate release tag syntax
        shell: bash
        env:
          LC_ALL: C
        run: |
          number='(0|[1-9][0-9]*)'
          grammar="^v${number}\.${number}\.${number}$"
          if [[ ! "${RELEASE_TAG}" =~ ${grammar} ]]; then
            echo "Release tag is not vMAJOR.MINOR.PATCH with no leading zeroes: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Check out the commit the run was started for
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      # The same grammar, by the function the tests hold to it, so the two
      # cannot drift apart.
      - name: Hold the tag to the tests' grammar
        shell: bash
        run: |
          python3 -I -c 'import sys; sys.path.insert(0, "tests"); import test_entries; sys.exit(0 if test_entries.release_tag_ok(sys.argv[1]) else 1)' "${RELEASE_TAG}" \
            || { echo "tests/test_entries.py refuses the release tag ${RELEASE_TAG}" >&2; exit 1; }

      - name: Require the tag to name that commit
        shell: bash
        run: |
          # ls-remote patterns match the end of a name, so lines are selected
          # by exact name. The peeled line is the commit an annotated tag
          # points to; a lightweight tag has only its own line.
          named="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" \
            | awk -v tag="refs/tags/${RELEASE_TAG}" '$2 == tag { plain = $1 } $2 == tag "^{}" { peeled = $1 } END { print (peeled != "" ? peeled : plain) }')"
          [ -n "${named}" ] && [ "${named}" = "${GITHUB_SHA}" ] || { echo "refs/tags/${RELEASE_TAG} names ${named:-nothing}; the run was started for ${GITHUB_SHA}" >&2; exit 1; }

      # Only merged work is released: a tag on a branch commit names a state
      # main may never hold. Any commit on main is admitted, not only its tip.
      # Main is named in full: a tag called origin/main would answer the short
      # name before the branch. A consumer checks no ancestry (the release
      # contract); this is the organisation's own rule for its catalog.
      - name: Require the tagged commit on main
        shell: bash
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main || { echo "Tagged commit ${GITHUB_SHA} is not on main" >&2; exit 1; }

      - name: Require release notes
        shell: bash
        run: |
          notes="docs/releases/${RELEASE_TAG}.md"
          test -s "${notes}" || { echo "${notes} is missing or empty at the tag" >&2; exit 1; }

      # GitHub creates a missing environment on first use, without protection.
      # Read the rule before anything is written so the publish gate cannot be
      # a bare name.
      - name: Require a reviewer on the release environment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          reviewers="$(gh api "repos/${GH_REPO}/environments/release" --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')" \
            || { echo "The release environment could not be read; create it with a required reviewer (docs/releasing.md)" >&2; exit 1; }
          [ "${reviewers}" -ge 1 ] || { echo "The release environment requires no reviewer" >&2; exit 1; }

  # The CI evidence main's CI recorded at this exact commit for the checks
  # that read the commit's tree alone, or a refusal (.github/ci-evidence.json,
  # docs/releasing.md). A refusal fails this job, naming its code, and with it
  # the release: nothing runs CI again on its own, and the fresh route is the
  # operator's choice. The tag, notes, package and publication checks of the
  # other jobs stay fresh.
  evidence:
    name: CI evidence at the tag
    needs: admit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Reading the CI runs, their jobs and their evidence artifacts.
      actions: read
    steps:
      - name: Check out the commit the run was started for
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # The Python main's CI ran its checks with, as ci.yml sets it up: the
      # evidence records it, and the gate compares it with this runner's.
      - name: Read the toolchains from dev.json
        id: dev
        run: |
          set -eu
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          m = json.load(open("dev.json", encoding="utf-8"))
          tc = m.get("toolchains", {})
          print("python=" + tc.get("python", {}).get("version", "3.12"))
          PY

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.dev.outputs.python }}

      - name: Reuse exact-commit main CI evidence, or refuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dev/release_evidence.py verify --output "${{ runner.temp }}/release-evidence.json"

      # The decision record, reuse or refusal, is also in the log of the step
      # above.
      - name: Keep the decision record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence.json
          if-no-files-found: error

  # The checks that read the tags and the release history (HISTORY_CHECKS in
  # ci.yml, the `entries` tests), in the tag's own context: the tagged commit's
  # ci.yml, called with `tag-context: true`, with the whole history and tags and
  # the specification at the commit it pins, so release.yml carries no second
  # copy of those checks or of the pin. It is the one run at the tag: ci.yml
  # does not run on a tag push. A check main has gained since that commit is
  # not run.
  verify:
    name: CI at the tag
    needs:
      - admit
      - evidence
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      tag-context: true

  package:
    name: Package
    needs:
      - admit
      - evidence
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the commit the run was started for
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # The release contract reads the manifest as the blob in the tagged
      # commit's tree, with no conversion; the asset is that blob. The checkout
      # converts nothing either (.gitattributes), and is compared to be sure.
      - name: Write the release's manifest and checksums
        shell: bash
        run: |
          mkdir dist
          git cat-file blob "${GITHUB_SHA}:manifest.json" > dist/manifest.json
          cmp dist/manifest.json manifest.json
          (cd dist && sha256sum manifest.json > checksums.txt && sha256sum --check --strict checksums.txt)
          cat dist/checksums.txt

      - name: Carry the release notes with the files
        shell: bash
        run: cp "docs/releases/${RELEASE_TAG}.md" dist/release-notes.md

      - name: Upload the release's files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: |
            dist/manifest.json
            dist/checksums.txt
            dist/release-notes.md
          if-no-files-found: error
          # As long as an approval may be waited for: the publish job reads
          # the artifact again after the gate.
          retention-days: 30

  attest-and-draft:
    name: Attest and draft release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      # The draft this run made, by its id: the publish job reads and
      # publishes that release, never whatever the tag names by then.
      release-id: ${{ steps.draft.outputs.release-id }}
    steps:
      - name: Download the release's files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Require the tag to still name that commit
        shell: bash
        run: |
          named="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" \
            | awk -v tag="refs/tags/${RELEASE_TAG}" '$2 == tag { plain = $1 } $2 == tag "^{}" { peeled = $1 } END { print (peeled != "" ? peeled : plain) }')"
          [ -n "${named}" ] && [ "${named}" = "${GITHUB_SHA}" ] || { echo "refs/tags/${RELEASE_TAG} names ${named:-nothing}; the files were written from ${GITHUB_SHA}" >&2; exit 1; }

      # An existing release, draft or published, is never replaced or completed
      # from here. A person inspects what a failed run left (docs/releasing.md).
      - name: Require that no release exists under this tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # List every release, drafts included, and match the tag exactly. A
          # failed lookup fails the step; it is never read as absence.
          state="$(gh api "repos/${GH_REPO}/releases" --paginate --jq '.[] | select(.tag_name == env.RELEASE_TAG) | if .draft then "a draft" else "published" end')"
          if [ -n "${state}" ]; then
            echo "A release under ${RELEASE_TAG} already exists, and it is $(echo "${state}" | sort -u | paste -sd, -)" >&2
            exit 1
          fi

      # The organisation's attestation action, as the Runner, the gateway and
      # the runtime pin it, making a build-provenance attestation. Both files
      # the release attaches are its subjects, each by its path;
      # checksums.txt also names manifest.json's digest.
      - name: Attest the release's files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/manifest.json
            dist/checksums.txt

      - name: Create draft release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh cannot infer the repository.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${RELEASE_TAG}" dist/manifest.json dist/checksums.txt \
            --draft \
            --notes-file dist/release-notes.md \
            --title "exchange ${RELEASE_TAG}" \
            --verify-tag
          # The one draft under the tag, which this job has just made (no
          # release existed under it before).
          # The listing can lag the creation by a few seconds: read it again
          # until the draft appears, at most twelve times.
          release_id=""
          for attempt in $(seq 1 12); do
            release_id="$(gh api "repos/${GH_REPO}/releases" --paginate --jq '.[] | select(.tag_name == env.RELEASE_TAG and .draft) | .id')"
            [[ "${release_id}" =~ ^[0-9]+$ ]] && break
            sleep 5
          done
          [[ "${release_id}" =~ ^[0-9]+$ ]] || { echo "Expected one draft release under ${RELEASE_TAG}; found: ${release_id:-none}" >&2; exit 1; }
          echo "release-id=${release_id}" >> "${GITHUB_OUTPUT}"

  publish:
    name: Publish release
    needs: attest-and-draft
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_ID: ${{ needs.attest-and-draft.outputs.release-id }}
    steps:
      - name: Require the tag to still name that commit
        shell: bash
        run: |
          named="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" \
            | awk -v tag="refs/tags/${RELEASE_TAG}" '$2 == tag { plain = $1 } $2 == tag "^{}" { peeled = $1 } END { print (peeled != "" ? peeled : plain) }')"
          [ -n "${named}" ] && [ "${named}" = "${GITHUB_SHA}" ] || { echo "refs/tags/${RELEASE_TAG} names ${named:-nothing}; the draft was written from ${GITHUB_SHA}" >&2; exit 1; }

      - name: Download the files this run wrote
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: run

      # The run's own files, the bytes the draft must hold: checksums.txt in
      # the one form this workflow writes it, naming manifest.json alone.
      - name: Hold the run's files to their checksums
        shell: bash
        working-directory: run
        run: |
          if grep -q -v -E '^[0-9a-f]{64}  [A-Za-z0-9._-]+$' checksums.txt; then
            echo "checksums.txt holds a line that is not a digest, two spaces and a plain name" >&2
            exit 1
          fi
          [ "$(awk '{ print $2 }' checksums.txt)" = "manifest.json" ] || { echo "checksums.txt does not name manifest.json alone" >&2; exit 1; }
          sha256sum --check --strict checksums.txt

      # A draft can be changed while it waits at the gate, by anyone who can
      # write to the repository. The release this run drafted is read through
      # the API by its id, never downloaded: its state, title and notes, then
      # the digest GitHub reports for each asset, compared with the run's
      # files. The publish call follows that last read at once, by the same id.
      # The moment between the two is the residual window docs/releasing.md
      # states; the next step closes it after the fact.
      - name: Require the draft to hold what this run wrote, and publish it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "${RELEASE_ID}" =~ ^[0-9]+$ ]] || { echo "No release id from the draft job: ${RELEASE_ID:-none}" >&2; exit 1; }
          written="$(cd run && for name in checksums.txt manifest.json; do printf '%s sha256:%s\n' "${name}" "$(sha256sum "${name}" | cut -d ' ' -f 1)"; done | LC_ALL=C sort)"

          state="$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}" --jq '[.draft, .tag_name, .name] | @tsv')"
          [ "${state}" = "$(printf 'true\t%s\texchange %s' "${RELEASE_TAG}" "${RELEASE_TAG}")" ] || { echo "Release ${RELEASE_ID} is not this run's draft of ${RELEASE_TAG}: ${state}" >&2; exit 1; }
          # Both are taken without the newlines they end in, which the two
          # ways of reading them do not agree on.
          drafted_notes="$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}" --jq .body)"
          written_notes="$(cat run/release-notes.md)"
          [ "${drafted_notes}" = "${written_notes}" ] || { echo "The draft's notes are not the notes the commit holds:" >&2; diff <(echo "${written_notes}") <(echo "${drafted_notes}") >&2; exit 1; }

          drafted="$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}/assets" --paginate --jq '.[] | "\(.name) \(.digest)"' | LC_ALL=C sort)"
          if [ "${drafted}" != "${written}" ]; then
            printf 'The draft does not hold what this run wrote.\nThis run wrote:\n%s\nThe draft holds:\n%s\n' "${written}" "${drafted}" >&2
            exit 1
          fi
          gh api -X PATCH "repos/${GH_REPO}/releases/${RELEASE_ID}" -F draft=false -f make_latest=true --silent

      # Published, the release is immutable once the repository's release
      # immutability is on (docs/releasing.md). Its assets are read once more:
      # a file replaced in the window is published only as a release this job
      # fails, by name, with both digest sets.
      - name: Require the published release to hold what this run wrote
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          written="$(cd run && for name in checksums.txt manifest.json; do printf '%s sha256:%s\n' "${name}" "$(sha256sum "${name}" | cut -d ' ' -f 1)"; done | LC_ALL=C sort)"
          draft="$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}" --jq .draft)"
          published="$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}/assets" --paginate --jq '.[] | "\(.name) \(.digest)"' | LC_ALL=C sort)"
          if [ "${draft}" != "false" ] || [ "${published}" != "${written}" ]; then
            printf 'The published release %s (release %s, draft: %s) does not hold what this run wrote.\nThis run wrote:\n%s\nThe release holds:\n%s\n' \
              "${RELEASE_TAG}" "${RELEASE_ID}" "${draft}" "${written}" "${published}" >&2
            exit 1
          fi
          echo "Published ${RELEASE_TAG} (release ${RELEASE_ID}):"
          echo "${published}"

name: Release

# Publishes a release of the Exchange, a catalog in the entry format: the
# manifest.json of a tagged commit, its checksums and a build-provenance
# attestation, from a tag a person pushes on a commit already on main
# (docs/releasing.md). What a release is to a consumer is the release
# contract (docs/release-contract.md, after RFC 0019 §7): the tagged commit,
# from which a consumer reads the manifest and every entry file as blobs.
# The release's manifest.json is that commit's blob, byte for byte.
#
# A person decides there is a release and writes its notes
# (docs/releases/<tag>.md). The workflow holds the tagged commit to CI,
# writes the release's files from it, attests them, and publishes no release
# until a maintainer approves the `release` environment.
#
# Not secret before that approval: the files (an artifact of the run), their
# attestation (recorded in a public log when made), and the draft (visible to
# those who can write to the repository).
#
# Every job works on the commit the run was started for, by digest. A tag is a
# name and can be moved until its release is published, so the tag is compared
# with that commit when the run begins, before the draft, and before publishing.

on:
  push:
    tags:
      # Narrowed here, held exactly to the grammar by the first step.
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

env:
  RELEASE_TAG: ${{ github.ref_name }}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  admit:
    name: Admit the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Reading an environment's protection rules.
      actions: read
    steps:
      # RFC 0019 §3's release-tag grammar: vMAJOR.MINOR.PATCH in ASCII digits,
      # no leading zeroes, nothing before or after (docs/entry-format.md).
      - name: Validate release tag syntax
        shell: bash
        env:
          LC_ALL: C
        run: |
          number='(0|[1-9][0-9]*)'
          grammar="^v${number}\.${number}\.${number}$"
          if [[ ! "${RELEASE_TAG}" =~ ${grammar} ]]; then
            echo "Release tag is not vMAJOR.MINOR.PATCH with no leading zeroes: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Check out the commit the run was started for
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      # The same grammar, by the function the tests hold to it, so the two
      # cannot drift apart.
      - name: Hold the tag to the tests' grammar
        shell: bash
        run: |
          python3 -I -c 'import sys; sys.path.insert(0, "tests"); import test_entries; sys.exit(0 if test_entries.release_tag_ok(sys.argv[1]) else 1)' "${RELEASE_TAG}" \
            || { echo "tests/test_entries.py refuses the release tag ${RELEASE_TAG}" >&2; exit 1; }

      - name: Require the tag to name that commit
        shell: bash
        run: |
          # ls-remote patterns match the end of a name, so lines are selected
          # by exact name. The peeled line is the commit an annotated tag
          # points to; a lightweight tag has only its own line.
          named="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" \
            | awk -v tag="refs/tags/${RELEASE_TAG}" '$2 == tag { plain = $1 } $2 == tag "^{}" { peeled = $1 } END { print (peeled != "" ? peeled : plain) }')"
          [ -n "${named}" ] && [ "${named}" = "${GITHUB_SHA}" ] || { echo "refs/tags/${RELEASE_TAG} names ${named:-nothing}; the run was started for ${GITHUB_SHA}" >&2; exit 1; }

      # Only merged work is released: a tag on a branch commit names a state
      # main may never hold. Any commit on main is admitted, not only its tip.
      # Main is named in full: a tag called origin/main would answer the short
      # name before the branch. A consumer checks no ancestry (the release
      # contract); this is the organisation's own rule for its catalog.
      - name: Require the tagged commit on main
        shell: bash
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main || { echo "Tagged commit ${GITHUB_SHA} is not on main" >&2; exit 1; }

      - name: Require release notes
        shell: bash
        run: |
          notes="docs/releases/${RELEASE_TAG}.md"
          test -s "${notes}" || { echo "${notes} is missing or empty at the tag" >&2; exit 1; }

      # GitHub creates a missing environment on first use, without protection.
      # Read the rule before anything is written so the publish gate cannot be
      # a bare name.
      - name: Require a reviewer on the release environment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          reviewers="$(gh api "repos/${GH_REPO}/environments/release" --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')" \
            || { echo "The release environment could not be read; create it with a required reviewer (docs/releasing.md)" >&2; exit 1; }
          [ "${reviewers}" -ge 1 ] || { echo "The release environment requires no reviewer" >&2; exit 1; }

  # The tagged commit's own ci.yml, called, so release.yml carries no second
  # copy of the `entries` checks or of the specification pin. A check main has
  # gained since that commit is not run.
  verify:
    name: CI at the tag
    needs: admit
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  package:
    name: Package
    needs:
      - admit
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the commit the run was started for
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # The release contract reads the manifest as the blob in the tagged
      # commit's tree, with no conversion; the asset is that blob. The checkout
      # converts nothing either (.gitattributes), and is compared to be sure.
      - name: Write the release's manifest and checksums
        shell: bash
        run: |
          mkdir dist
          git cat-file blob "${GITHUB_SHA}:manifest.json" > dist/manifest.json
          cmp dist/manifest.json manifest.json
          (cd dist && sha256sum manifest.json > checksums.txt && sha256sum --check --strict checksums.txt)
          cat dist/checksums.txt

      - name: Carry the release notes with the files
        shell: bash
        run: cp "docs/releases/${RELEASE_TAG}.md" dist/release-notes.md

      - name: Upload the release's files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: |
            dist/manifest.json
            dist/checksums.txt
            dist/release-notes.md
          if-no-files-found: error
          # As long as an approval may be waited for: the publish job reads
          # the artifact again after the gate.
          retention-days: 30

  attest-and-draft:
    name: Attest and draft release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download the release's files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Require the tag to still name that commit
        shell: bash
        run: |
          named="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" \
            | awk -v tag="refs/tags/${RELEASE_TAG}" '$2 == tag { plain = $1 } $2 == tag "^{}" { peeled = $1 } END { print (peeled != "" ? peeled : plain) }')"
          [ -n "${named}" ] && [ "${named}" = "${GITHUB_SHA}" ] || { echo "refs/tags/${RELEASE_TAG} names ${named:-nothing}; the files were written from ${GITHUB_SHA}" >&2; exit 1; }

      # An existing release, draft or published, is never replaced or completed
      # from here. A person inspects what a failed run left (docs/releasing.md).
      - name: Require that no release exists under this tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # List every release, drafts included, and match the tag exactly. A
          # failed lookup fails the step; it is never read as absence.
          state="$(gh api "repos/${GH_REPO}/releases" --paginate --jq '.[] | select(.tag_name == env.RELEASE_TAG) | if .draft then "a draft" else "published" end')"
          if [ -n "${state}" ]; then
            echo "A release under ${RELEASE_TAG} already exists, and it is $(echo "${state}" | sort -u | paste -sd, -)" >&2
            exit 1
          fi

      # The organisation's attestation step, as the Runner, the gateway and the
      # runtime pin it: actions/attest makes a build-provenance attestation of
      # each file checksums.txt names.
      - name: Attest the release's manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh cannot infer the repository.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${RELEASE_TAG}" dist/manifest.json dist/checksums.txt \
            --draft \
            --notes-file dist/release-notes.md \
            --title "exchange ${RELEASE_TAG}" \
            --verify-tag

  publish:
    name: Publish release
    needs: attest-and-draft
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Require the tag to still name that commit
        shell: bash
        run: |
          named="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" \
            | awk -v tag="refs/tags/${RELEASE_TAG}" '$2 == tag { plain = $1 } $2 == tag "^{}" { peeled = $1 } END { print (peeled != "" ? peeled : plain) }')"
          [ -n "${named}" ] && [ "${named}" = "${GITHUB_SHA}" ] || { echo "refs/tags/${RELEASE_TAG} names ${named:-nothing}; the draft was written from ${GITHUB_SHA}" >&2; exit 1; }

      - name: Download the files this run wrote
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: run

      # A draft can be changed while it waits at the gate, by anyone who can
      # write to the repository. Download it as it now stands and compare it
      # with what this run wrote: the title the workflow gave it, the notes the
      # commit holds, the same files by name, the same list of checksums, and
      # every file the bytes that list names. A moment remains between this
      # check and publishing; nothing here closes it.
      - name: Require the draft to hold what this run wrote
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          state="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)"
          [ "${state}" = "true" ] || { echo "The release under ${RELEASE_TAG} is not a draft" >&2; exit 1; }

          drafted_title="$(gh release view "${RELEASE_TAG}" --json name --jq .name)"
          [ "${drafted_title}" = "exchange ${RELEASE_TAG}" ] || { echo "The draft is titled ${drafted_title}; the workflow titled it exchange ${RELEASE_TAG}" >&2; exit 1; }
          # Both are taken without the newlines they end in, which the two
          # ways of reading them do not agree on.
          drafted_notes="$(gh release view "${RELEASE_TAG}" --json body --jq .body)"
          written_notes="$(cat run/release-notes.md)"
          [ "${drafted_notes}" = "${written_notes}" ] || { echo "The draft's notes are not the notes the commit holds:" >&2; diff <(echo "${written_notes}") <(echo "${drafted_notes}") >&2; exit 1; }

          mkdir draft
          gh release download "${RELEASE_TAG}" --dir draft

          written="$(cd run && find . -type f ! -name release-notes.md | LC_ALL=C sort)"
          drafted="$(cd draft && find . -type f | LC_ALL=C sort)"
          [ "${written}" = "${drafted}" ] || { echo "The draft does not hold the files this run wrote:" >&2; diff <(echo "${written}") <(echo "${drafted}") >&2; exit 1; }

          cmp run/checksums.txt draft/checksums.txt
          # The list is read in the one form this workflow writes it: a digest,
          # two spaces, and a name of plain characters. Any other line is
          # refused, though a checksum program would read it.
          if grep -q -v -E '^[0-9a-f]{64}  [A-Za-z0-9._-]+$' draft/checksums.txt; then
            echo "checksums.txt holds a line that is not a digest, two spaces and a plain name" >&2
            exit 1
          fi
          named="$(awk '{ print "./" $2 }' draft/checksums.txt | LC_ALL=C sort)"
          files="$(cd draft && find . -type f ! -name checksums.txt | LC_ALL=C sort)"
          [ "${named}" = "${files}" ] || { echo "checksums.txt does not name the draft's files, each once:" >&2; diff <(echo "${named}") <(echo "${files}") >&2; exit 1; }
          (cd draft && sha256sum --check --strict checksums.txt)

      # The grammar has no prerelease, so every release is marked latest.
      - name: Publish the reviewed draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${RELEASE_TAG}" --draft=false --latest
